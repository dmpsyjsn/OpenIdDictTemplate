<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>||App.Name|| - Account Created</title>
</head>
<body style="font-family: Arial, sans-serif;">
<div style="max-width: 600px; margin: 0 auto;">
    <p style="font-weight: 600; font-size: 1.1rem;">Hello ||Account.FirstName||,</p>
    <p>
        Welcome to ||App.Name||! An account has been created for you.
    </p>
    <p>
        To activate your account, please verify your email address and choose a password by clicking the button below:
    </p>
    <p>
        <a href="||Account.VerifyEmailLink||"
           style="display: inline-block; padding: 1rem 2rem; color: #fff; background-color: #218838; font-weight: bold; border-radius: 20px; text-decoration: none;">
            Confirm your account
        </a>
    </p>
    <p style="padding-top: 30px; font-size: 0.9rem;">
        If you received this email by mistake, you can <a href="||Account.CancelEmailLink||">cancel the account</a>.
    </p>
</div>
</body>
</html>
