<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>||App.Name|| - Reset Password</title>
</head>
<body style="font-family: Arial, sans-serif;">
<div style="max-width: 600px; margin: 0 auto;">
    <p>Hi,</p>
    <p>
        We received a request to reset your ||App.Name|| password. Click the button below to choose a new password.
    </p>
    <p>
        <a href="||Account.ResetPasswordLink||"
           style="display: inline-block; padding: 1rem 2rem; color: #fff; background-color: #218838; font-weight: bold; border-radius: 20px; text-decoration: none;">
            Reset my password
        </a>
    </p>
    <p style="font-size: 0.9rem;">If you did not request this, you can safely ignore this email.</p>
    <p>Thanks!<br />The ||App.Name|| Team</p>
</div>
</body>
</html>
